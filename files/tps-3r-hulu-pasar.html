*{box-sizing:border-box}

.panel{padding:12px;overflow:auto;min-height:0;min-width:0}

.sub{margin:14px 0 6px;font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sub:first-child{margin-top:0}

      b.className = 'btn'; b.type = 'button'; b.id = 'vw-' + key;
      b.innerHTML = '<span>' + p.k[li()] + '</span><i>' + p.c[li()] + '</i>';
      b.addEventListener('click', function () { goTo(key); });
      viewsEl.appendChild(b);
    });
  }

  var layersEl = document.getElementById('layers');
  function buildLayers() {
    layersEl.innerHTML = '';
    LAYERS.forEach(function (l) {
      var row = document.createElement('label'); row.className = 'row';
      row.innerHTML = '<input type="checkbox" id="ly-' + l.id + '"' + (layerGroups[l.id].visible ? ' checked' : '') + '><span class="sw" style="background:' + l.color + '"></span><span class="nm">' + l.n[li()] + '<small>' + l.c[li()] + '</small></span>';
      layersEl.appendChild(row);
      row.querySelector('input').addEventListener('change', function (e) { setLayer(l.id, e.target.checked); });
    });
  }
  function setLayer(id, on) {
    layerGroups[id].visible = on;
    var el = document.getElementById('ly-' + id); if (el) { el.checked = on; }
    if (selMesh && !layerGroups[selMesh.userData.info.layer].visible) { clearSel(); }
    if (id === 'found' || id === 'site') { updateGround(); }
    shadowDirty = true;
    dirty = true;
  }
  function updateGround() {
    var glassy = layerGroups.found.visible && layerGroups.site.visible;
    [grassMat, pavMat].forEach(function (m) { m.transparent = glassy; m.opacity = glassy ? 0.28 : 1; m.depthWrite = !glassy; m.needsUpdate = true; });
  }
  document.getElementById('ly-all').addEventListener('click', function () {
    LAYERS.forEach(function (l) { setLayer(l.id, l.on); });
    updateGround();
  });
  document.getElementById('ly-skel').addEventListener('click', function () {
    var show = { frame: 1, cols: 1, floor: 1, found: 1 };
    LAYERS.forEach(function (l) { setLayer(l.id, !!show[l.id] || l.id === 'dims'); });
    updateGround();
  });

  document.getElementById('opt-doors').addEventListener('change', function (e) { doorGoal = e.target.checked ? 1 : 0; dirty = true; });
  document.getElementById('opt-xray').addEventListener('change', function (e) {
    xray = e.target.checked;
    M.wall.transparent = xray; M.wall.opacity = xray ? 0.22 : 1; M.wall.depthWrite = !xray; M.wall.needsUpdate = true;
    shadowDirty = true;
    dirty = true;
  });
  var perfEl = document.getElementById('opt-perf');
  perfEl.checked = perf.light;
  perfEl.addEventListener('change', function (e) {
    perf.light = e.target.checked;
    try { localStorage.setItem('tps3r-perf', perf.light ? '1' : '0'); } catch (err) { /* storage unavailable */ }
    applyPixel(); resize();
    applyShadows(); applyEnv();
  });
  document.getElementById('opt-spin').addEventListener('change', function (e) { spin = e.target.checked; tween = null; dirty = true; });

  var modeBtns = document.querySelectorAll('#sec-modes .btn');
  var slider = document.getElementById('sec-pos'), flipBtn = document.getElementById('sec-flip');
  Array.prototype.forEach.call(modeBtns, function (b) {
    b.addEventListener('click', function () {
      sec.mode = b.getAttribute('data-mode');
      Array.prototype.forEach.call(modeBtns, function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      slider.disabled = flipBtn.disabled = sec.mode === 'off';
      updateSection();
    });
  });
  slider.addEventListener('input', function () { sec.t = slider.value / 1000; updateSection(); });
  flipBtn.addEventListener('click', function () { sec.flip = !sec.flip; updateSection(); });

  /* light tab */
  var timeBtns = document.querySelectorAll('#time-modes .btn');
  Array.prototype.forEach.call(timeBtns, function (b) {
    b.addEventListener('click', function () {
      env.time = b.getAttribute('data-time');
      Array.prototype.forEach.call(timeBtns, function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      applyEnv();
    });
  });
  document.getElementById('opt-shadow').addEventListener('change', function (e) { env.shadows = e.target.checked; applyShadows(); });
  document.getElementById('opt-lamps').addEventListener('change', function (e) { env.lamps = e.target.checked; applyEnv(); });
  var azEl = document.getElementById('sun-az');
  function updateAzOut() { document.getElementById('sun-out').textContent = tr('lt.dir.out').replace('{v}', env.az); }
  azEl.addEventListener('input', function () { env.az = parseInt(azEl.value, 10) || 0; updateAzOut(); applyEnv(); });

  /* specs tab */
  var SPECS = [
    ['Footprint', 'Luas', '17.35 × 6.00 m, 104.1 m²', '17.35 × 6.00 m, 104.1 m²'],
    ['Bays', 'Bentang', '6.35 m walled bay with folding gate, 11.00 m bay open to the front', 'Bentang 6.35 m berdinding dengan folding gate, bentang 11.00 m terbuka di depan'],
    ['Floor', 'Lantai', '+0.20 m. Tanah urug 13 cm, cor beton 7 cm, keramik 40×40', '+0.20 m. Tanah urug 13 cm, cor beton 7 cm, keramik 40×40'],
    ['Beam level', 'Tinggi balok', '+3.15 m back and middle lines, +2.90 m front line', '+3.15 m as belakang dan tengah, +2.90 m as depan'],
    ['Ridge', 'Bubungan', '+4.72 m (5.22 m from footing base), cap 0.50 m above', '+4.72 m (5.22 m dari dasar pondasi), jambul 0.50 m di atasnya'],
    ['Roof', 'Atap', 'Gable over the back 3.00 m, lean-to over the front 3.00 m. Zincalum C-75, reng 32.45, seng soka biru', 'Pelana di atas 3.00 m belakang, atap miring di atas 3.00 m depan. Zincalum C-75, reng 32.45, seng soka biru'],
    ['Footing', 'Pondasi', 'Batu belah camp. 1:4, 0.30 top, 0.40 base, 0.50 deep', 'Batu belah camp. 1:4, atas 0.30, dasar 0.40, dalam 0.50'],
    ['Sloof / Column', 'Sloof / Kolom', 'Concrete 15/20 and 15/15, Ø10 bars, Ø8-20 stirrups', 'Beton 15/20 dan 15/15, tulangan Ø10, sengkang Ø8-20'],
    ['Ringbalk', 'Ringbalk', 'Ulin 9/9, bolted splices', 'Ulin 9/9, sambungan baut'],
    ['Openings', 'Bukaan', 'P1 ulin door 0.85 × 2.00 with 5 mm glass above. FG folding gate 6.20 × 2.65', 'Pintu ulin P1 0.85 × 2.00 dengan kaca 5 mm di atasnya. Folding gate FG 6.20 × 2.65'],
    ['Power', 'Listrik', '9 LED 10 W lamps, 2 stop kontak, 2 saklar ganda, 1 saklar tunggal', '9 lampu LED 10 W, 2 stop kontak, 2 saklar ganda, 1 saklar tunggal']
  ];
  var NOTES = [
    ['Wall material and thickness. Modelled as 15 cm solid walls up to the ringbalk.', 'Bahan dan tebal dinding. Dimodelkan sebagai dinding pasangan 15 cm sampai ringbalk.'],
    ['Footings and sloof are drawn for the front 3.00 m only.', 'Pondasi dan sloof hanya digambar untuk 3.00 m bagian depan.'],
    ['The ringbalk plan shows the front line only. Ringbalks on the back and middle lines are assumed.', 'Rencana ringbalk hanya menunjukkan as depan. Ringbalk as belakang dan tengah diasumsikan.'],
    ['The two low partitions (x = 8.35 and 10.35 m) are about 2.00 m high, estimated from the 3D sheets. The use of the small room is not stated. Roof batten spacing is not dimensioned.', 'Dua sekat rendah (x = 8.35 dan 10.35 m) setinggi sekitar 2.00 m, perkiraan dari gambar 3D. Fungsi ruang kecil tidak disebutkan. Jarak reng atap tidak berdimensi.'],
    ['Wiring routes are not modelled, only lamps, switches and outlets.', 'Jalur kabel tidak dimodelkan, hanya lampu, saklar dan stop kontak.'],
    ['North appears only on the satellite layout sheet (north up, long side roughly north to south). The model is not rotated to a compass heading.', 'Arah utara hanya tampak pada lembar layout satelit (utara di atas, sisi panjang kira-kira utara ke selatan). Model tidak diputar mengikuti arah mata angin.']
  ];
  function buildSpecs() {
    var h = '<h3 class="sub">' + tr('sp.key') + '</h3><dl class="dl">';
    SPECS.forEach(function (r) { h += '<dt>' + r[li()] + '</dt><dd>' + r[2 + li()] + '</dd>'; });
    h += '<dt>' + (lang === 'id' ? 'Lokasi' : 'Site') + '</dt><dd><a href="https://www.google.com/maps?q=-2.419815,115.263280" target="_blank" rel="noopener">-2.419815, 115.263280</a></dd></dl>';
    h += '<h3 class="sub">' + tr('sp.nofix') + '</h3><ul class="notes">';
    NOTES.forEach(function (n) { h += '<li>' + n[li()] + '</li>'; });
    h += '</ul><h3 class="sub">' + tr('sp.sheets') + '</h3><p class="out">Layout, Tampak 3D, Denah, Tampak depan / belakang / samping, Potongan A-A, Rencana pondasi, sloof, kolom, ringbalk, atap, pintu, keramik, elektrikal, Detail pondasi dan penulangan, Detail pintu.</p>';
    document.getElementById('specs-body').innerHTML = h;
  }

  /* language switch */
  function setLang(next) {
    lang = next;
    try { localStorage.setItem('tps3r-lang', lang); } catch (err) { /* storage unavailable */ }
    document.getElementById('lg-id').setAttribute('aria-pressed', lang === 'id' ? 'true' : 'false');
    document.getElementById('lg-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    applyStatic();
    dom.setAttribute('aria-label', tr('canvas.aria'));
    buildViews(); buildLayers(); buildSpecs();
    updateSection(); updateAzOut();
    paintLabels(); showCard();
    dirty = true;
  }
  document.getElementById('lg-id').addEventListener('click', function () { setLang('id'); });
  document.getElementById('lg-en').addEventListener('click', function () { setLang('en'); });

  /* ---------- size and loop ---------- */
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) { return; }
    renderer.setSize(w, h, false);
    aspect = w / h; cam.aspect = aspect; cam.updateProjectionMatrix();
    dirty = true;
  }
  if (window.ResizeObserver) { new ResizeObserver(resize).observe(stage); }
  window.addEventListener('resize', resize);

  function frame(now) {
    requestAnimationFrame(frame);
    var changed = false;
    if (tween) {
      var k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k), f = tween.from, t = tween.to;
      view.theta = f.theta + (t.theta - f.theta) * e; view.phi = f.phi + (t.phi - f.phi) * e;
      view.r = f.r + (t.r - f.r) * e; view.tx = f.tx + (t.tx - f.tx) * e;
      view.ty = f.ty + (t.ty - f.ty) * e; view.tz = f.tz + (t.tz - f.tz) * e;
      if (k >= 1) { tween = null; }
      changed = true;
    }
    if (spin && !dragging && !tween) { view.theta += 0.004; changed = true; }
    if (Math.abs(doorGoal - doorT) > 0.0004) {
      doorT += (doorGoal - doorT) * 0.1;
      if (Math.abs(doorGoal - doorT) <= 0.0004) { doorT = doorGoal; }
      applyDoors(); changed = true;
      if (selBox && selMesh && selMesh.userData.info.layer === 'doors') { selBox.update(); }
    }
    if (dirty || changed) {
      applyCam();
      if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
      renderer.render(scene, cam); dirty = false;
    }
  }

  document.getElementById('lg-id').setAttribute('aria-pressed', lang === 'id' ? 'true' : 'false');
  document.getElementById('lg-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  dom.setAttribute('aria-label', tr('canvas.aria'));
  buildViews(); buildLayers(); buildSpecs();
  updateSection(); updateAzOut();
  applyEnv();
  applyShadows();
  updateGround();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { paintLabels(); dirty = true; }); }
  resize();
  var p0 = PRESETS.iso; view.theta = p0.theta; view.phi = p0.phi; view.r = fitR(p0);
  view.tx = p0.tx; view.ty = p0.ty; view.tz = p0.tz;
  applyCam();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
